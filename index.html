<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McDermott Studio</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "gsap": "./vendor/gsap/index.js"
  }
}
</script>
<style>
  :root {
    --navy: #000042;
    --teal: #00E2C1;
    --gold: #E5AC2E;
    --white: #FFFFFF;
    --abyss: #00000f;
  }
  html, body { margin: 0; height: 100%; background: var(--abyss); overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* The stage is always 1920x1080 logical px and scaled to fit, so type sizes are frame-true. */
  #frame { flex: 1; position: relative; min-height: 0; }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    background: var(--navy);
    overflow: hidden;
  }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

  /* Type layer: Georgia for display, Arial only for small tracked labels. No webfonts. */
  #type { position: absolute; inset: 0; pointer-events: none; }
  .line {
    position: absolute; left: 0; right: 0;
    text-align: center; color: var(--white);
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: normal;
    opacity: 0; white-space: nowrap;
    will-change: opacity, filter, letter-spacing;
  }
  .line.copy  { top: 858px; font-size: 46px; letter-spacing: 0.01em; }
  .line.title { top: 468px; font-size: 118px; letter-spacing: -0.005em; }
  .line.sign  { top: 944px; font-size: 38px; }
  .label {
    font-family: Arial, Helvetica, sans-serif; font-size: 15px;
    letter-spacing: 0.32em; text-transform: uppercase; color: var(--white);
  }

  #lockup {
    position: absolute; left: 50%; top: 500px;
    width: 600px; transform: translate(-50%, -50%);
    opacity: 0;
  }
  #lockup img { display: block; width: 100%; height: auto; }
  #lockup .missing {
    height: 170px; border: 1px dashed rgba(0, 226, 193, 0.55);
    display: flex; align-items: center; justify-content: center;
    color: var(--teal); opacity: 0.8;
  }

  /* Dev bar: never part of the frame, hidden in export. */
  #dev {
    flex: none; height: 64px; box-sizing: border-box; padding: 10px 20px 12px;
    background: #03031a; border-top: 1px solid #12124a;
    font: 12px/1 Arial, Helvetica, sans-serif; color: #8d93c9;
    display: flex; flex-direction: column; gap: 8px; user-select: none;
  }
  #dev .row { display: flex; align-items: center; gap: 16px; }
  #dev .time { color: #fff; font-variant-numeric: tabular-nums; min-width: 128px; }
  #dev .beat { color: var(--teal); min-width: 190px; letter-spacing: 0.08em; }
  #dev .hint { margin-left: auto; opacity: 0.7; }
  #dev .fps  { font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
  #track { position: relative; height: 18px; cursor: pointer; }
  #track .rail { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: #1a1a55; }
  #track .fill { position: absolute; left: 0; top: 8px; height: 2px; background: var(--teal); }
  #track .tick { position: absolute; top: 3px; width: 1px; height: 12px; background: #3a3f86; }
  #track .tick span { position: absolute; top: -1px; left: 5px; font-size: 10px; color: #5c62a8; white-space: nowrap; }
  #track .head { position: absolute; top: 2px; width: 2px; height: 14px; background: #fff; margin-left: -1px; }
  body.export #dev { display: none; }
  body.export #frame { position: fixed; inset: 0; }
  body.export #stage { left: 0; top: 0; transform: none !important; }
</style>
</head>
<body>
  <div id="frame">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div id="type">
        <div class="line copy" data-cue="b1">Most firms are buying the same tools.</div>
        <div class="line copy" data-cue="b2a">We chose to build our own.</div>
        <div class="line title" data-cue="b2b">McDermott Studio</div>
        <div class="line copy" data-cue="b3">Built for the matter. Not the market.</div>
        <div class="line copy" data-cue="b4">Your information. Our walls.</div>
        <div id="lockup"><img src="assets/lockup-teal-on-dark.png" alt="McDermott Studio"></div>
        <div class="line sign" data-cue="b5">Built in-house. Built for law.</div>
      </div>
    </div>
  </div>
  <div id="dev">
    <div class="row">
      <span class="time" id="t">0.00 s</span>
      <span class="beat" id="beat"></span>
      <span class="fps" id="fps"></span>
      <span class="hint">Space replay · P pause · ← → 1 s · , . 1 frame · 1–5 beats · M sound</span>
    </div>
    <div id="track"><div class="rail"></div><div class="fill"></div><div class="head"></div></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
