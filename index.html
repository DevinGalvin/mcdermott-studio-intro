<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McDermott Studio</title>
<script type="importmap">
{ "imports": { "gsap": "./vendor/gsap/index.js" } }
</script>
<style>
  :root {
    --navy: #000042;
    --teal: #00E2C1;
    --gold: #E5AC2E;
    --white: #FFFFFF;
    --abyss: #00000f;
  }
  html, body { margin: 0; height: 100%; background: var(--abyss); overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* The stage is always 1920x1080 logical px, scaled to fit. */
  #frame { flex: 1; position: relative; min-height: 0; }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; transform-origin: 0 0;
    background: var(--navy); overflow: hidden;
  }

  /* ── Shots: each is a full-frame layer, shown only during its cut ────────── */
  #shots, .shot { position: absolute; inset: 0; }
  .shot { overflow: hidden; display: none; }
  .abs { position: absolute; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }
  .sans  { font-family: Arial, Helvetica, sans-serif; text-transform: uppercase; }
  .white { color: var(--white); }
  .teal  { color: var(--teal); }
  .gold  { color: var(--gold); }
  .ghost { color: rgba(255, 255, 255, 0.16); }
  .nowrap { white-space: nowrap; }
  .w { display: inline-block; will-change: transform, opacity; }

  /* Contract pages for the wall shots. */
  .plane { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .page {
    position: absolute; width: 300px; height: 388px; box-sizing: border-box; padding: 24px 24px 20px; overflow: hidden;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.09);
    color: rgba(255, 255, 255, 0.5); font: 9px/1.5 Georgia, 'Times New Roman', serif; text-align: justify;
  }
  .page .hd {
    font: 6.5px/1 Arial, Helvetica, sans-serif; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.62);
    display: flex; justify-content: space-between; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  .page h4 { margin: 10px 0 4px; font: 6.5px/1 Arial, Helvetica, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.64); font-weight: normal; }
  .page p { margin: 0 0 5px; }
  .page b { font-weight: normal; color: rgba(255,255,255,0.64); margin-right: 4px; }
  .page .fc { color: rgba(255, 255, 255, 0.95); text-decoration-line: line-through; text-decoration-thickness: 1px; text-decoration-color: rgba(0,226,193,0); }
  .page .ins { display: none; margin-top: 3px; color: var(--teal); font-size: 10px; }
  .page .mt { display: none; color: var(--teal); }
  .page.rw { border-color: rgba(0, 226, 193, 0.35); }
  .page.rw .fc { color: rgba(255,255,255,0.4); text-decoration-color: var(--teal); }
  .page.rw .ins, .page.rw .mt { display: block; }
  .page.rw .mt { display: inline; }
  .page.rw .st { display: none; }
  .page.gray { background: rgba(150, 155, 170, 0.22); border-color: rgba(200, 205, 215, 0.35); color: rgba(255,255,255,0.55); }

  .bar { position: absolute; background: var(--teal); }
  .bar.gold { background: var(--gold); }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,15,0) 60%, rgba(0,0,15,0.5) 100%);
  }
  #lockup .missing {
    width: 560px; height: 150px; border: 1px dashed rgba(0, 226, 193, 0.55); display: flex; align-items: center; justify-content: center;
    font: 13px/1 Arial, Helvetica, sans-serif; letter-spacing: 0.28em; text-transform: uppercase; color: var(--teal);
  }
  #lockup img { display: block; width: 560px; height: auto; }

  /* ── Player (never part of the frame) ─────────────────────────────────── */
  #bigplay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 15, 0.35); border: 0; cursor: pointer; padding: 0;
  }
  #bigplay span {
    width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85);
    display: flex; align-items: center; justify-content: center;
  }
  #bigplay svg { width: 52px; height: 52px; margin-left: 10px; fill: #fff; }
  #bigplay:focus-visible span { outline: 3px solid var(--teal); outline-offset: 6px; }
  #dev {
    flex: none; height: 64px; box-sizing: border-box; padding: 10px 20px 12px;
    background: #03031a; border-top: 1px solid #12124a;
    font: 12px/1 Arial, Helvetica, sans-serif; color: #8d93c9;
    display: flex; flex-direction: column; gap: 8px; user-select: none;
  }
  #dev .row { display: flex; align-items: center; gap: 16px; }
  #dev .time { color: #fff; font-variant-numeric: tabular-nums; min-width: 128px; }
  #dev .beat { color: var(--teal); min-width: 190px; letter-spacing: 0.08em; }
  #dev .hint { margin-left: auto; opacity: 0.7; }
  #dev .fps  { font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
  #playbtn {
    flex: none; width: 34px; height: 24px; border: 1px solid #2a2f78; border-radius: 4px;
    background: transparent; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #playbtn svg { width: 12px; height: 12px; fill: currentColor; }
  #playbtn:focus-visible { outline: 2px solid var(--teal); }
  #track { position: relative; height: 18px; cursor: pointer; }
  #track .rail { position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: #1a1a55; }
  #track .fill { position: absolute; left: 0; top: 8px; height: 2px; background: var(--teal); }
  #track .tick { position: absolute; top: 3px; width: 1px; height: 12px; background: #3a3f86; }
  #track .tick span { position: absolute; top: -1px; left: 5px; font-size: 10px; color: #5c62a8; white-space: nowrap; }
  #track .head { position: absolute; top: 2px; width: 2px; height: 14px; background: #fff; margin-left: -1px; }
  @media (max-width: 720px) { #dev .hint, #track .tick span { display: none; } }
  body.export #dev, body.export #bigplay { display: none; }
  body.export #frame { position: fixed; inset: 0; }
  body.export #stage { left: 0; top: 0; transform: none !important; }
</style>
</head>
<body>
  <div id="frame">
    <div id="stage">
      <div id="shots"></div>
      <div id="vignette"></div>
      <button id="bigplay" aria-label="Play film"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>
    </div>
  </div>
  <div id="dev">
    <div class="row">
      <button id="playbtn" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
      <span class="time" id="t">0.00 s</span>
      <span class="beat" id="beat"></span>
      <span class="fps" id="fps"></span>
      <span class="hint">Space replay · P pause · ← → 1 s · , . 1 frame · 1–6 sections · M sound</span>
    </div>
    <div id="track"><div class="rail"></div><div class="fill"></div><div class="head"></div></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
